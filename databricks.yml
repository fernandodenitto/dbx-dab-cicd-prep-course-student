# Lakeshore Outfitters — data platform. Declarative Automation Bundle (formerly Databricks Asset Bundle).
# This file is the entry point: the CLI looks for it at the root of the project.

bundle:
  # The name is part of the deploy path (.bundle/<name>/<target>), so it must be unique
  # per workspace — two bundles with the same name and target overwrite each other.
  name: lakeshore-platform
  # Everyone who deploys this bundle — you, a teammate, the CI runner — must use a CLI
  # at least this recent. Bundle behaviour changes between releases; pinning makes
  # "works on my machine" a version mismatch the CLI catches for you.
  databricks_cli_version: ">= 1.19.0"

# Every resource definition lives in its own file under resources/.
include:
  - resources/*.yml

# Dashboards are deployed as dashboards (resources/revenue.dashboard.yml), so their
# JSON doesn't also need to be uploaded as a plain workspace file.
sync:
  exclude:
    - src/dashboards/*.lvdash.json

# Built on every deploy, uploaded with the bundle, referenced by tasks as ./dist/*.whl.
artifacts:
  lakeshore_wheel:
    type: whl
    build: uv build --wheel
    path: .
    # Append a build timestamp to the wheel version (0.1.0 -> 0.1.0+<timestamp>), so every
    # deploy ships a distinct version and no environment reuses a stale install.
    dynamic_version: true

variables:
  # Simple variable: a string, set per target below.
  catalog:
    description: The Unity Catalog catalog of the environment. One catalog per environment.

  # Lookup variable: we write the warehouse's NAME; the CLI resolves its ID at deploy
  # time in whatever workspace it deploys to. No workspace-specific ID in the repo.
  warehouse_id:
    description: SQL warehouse for SQL tasks and dashboards
    lookup:
      warehouse: Serverless Starter Warehouse

  # Who production jobs run as. Each production target looks its service principal up
  # by display name, so no application ID is committed.
  run_as_sp:
    description: Application ID of the service principal that runs this target's jobs
    default: ""   # unused in dev: development deploys run as the developer

  # In production, data-holding objects (schemas, volumes) can't be deleted by a deploy
  # or a destroy: the CLI refuses until a reviewed pull request turns this off.
  protect_data:
    description: Set lifecycle.prevent_destroy on schemas and volumes
    default: false

  # Pipeline names must be unique in a workspace (job names needn't be). Staging and prod
  # share one Free Edition workspace, so staging's pipeline gets a label — the first prod
  # release failed on exactly this. With separate workspaces you wouldn't need it.
  pipeline_label:
    description: Prefix for the pipeline name in targets that share a workspace with prod
    default: ""

  # Complex variable: a map (or a list) instead of a string.
  tags:
    description: Tags on every job of the platform — who owns it, what it belongs to
    type: complex
    default:
      project: lakeshore-platform
      owner: data-platform

# Who may see and manage what the bundle deploys, applied to every job and pipeline.
# Groups, not people: nobody's e-mail in a public repository, and nothing to update
# when someone joins or leaves.
permissions:
  - group_name: users
    level: CAN_VIEW
  - group_name: admins
    level: CAN_MANAGE

# Presets: settings applied to every resource the bundle deploys, so they can't be
# forgotten on the next job someone adds. Targets can add their own on top.
presets:
  tags:
    environment: ${bundle.target}
    # Which commit is running? Answerable from the job page, in every environment.
    git_commit: ${bundle.git.commit}

# One workspace, three environments. What changes between them is decided here, and
# only here: the mode, the catalog, and (for production modes) the single deploy path.
# No workspace.host anywhere: the CLI takes the workspace from your profile or, in CI,
# from DATABRICKS_HOST. This repository is public.
targets:
  dev:
    mode: development
    default: true
    # Your dev copy is yours: you manage it, the groups above can still see it.
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    variables:
      catalog: lakeshore_dev

  # Deployed only by CI, as the staging service principal, on every merge to main.
  staging:
    mode: production
    workspace:
      # Production mode insists on an explicit root path: one known place where the
      # single copy lives. Deployed by a service principal, this resolves to the SP's
      # own home folder.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    presets:
      # Staging runs when CI runs it — never because the clock says so.
      trigger_pause_status: PAUSED
    run_as:
      service_principal_name: ${var.run_as_sp}
    # The service principal deploys AND runs this target: it must manage what it deploys.
    permissions:
      - service_principal_name: ${var.run_as_sp}
        level: CAN_MANAGE
    variables:
      catalog: lakeshore_staging
      pipeline_label: "[staging] "
      run_as_sp:
        lookup:
          service_principal: sp-lakeshore-staging

  # Deployed only by CI, as the production service principal, after an approval.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_sp}
    # The service principal deploys AND runs this target: it must manage what it deploys.
    permissions:
      - service_principal_name: ${var.run_as_sp}
        level: CAN_MANAGE
    variables:
      catalog: lakeshore_prod
      protect_data: true
      run_as_sp:
        lookup:
          service_principal: sp-lakeshore-prod
