# The smallest useful job: proves a deploy reached the workspace and that
# serverless compute can run our code. Later lessons turn it into a smoke test.

resources:
  jobs:
    health_check:
      name: lakeshore-platform-health-check

      # Every morning at 06:30 UTC. No pause_status here: development mode deploys
      # every schedule PAUSED, so a dev copy never fires on its own.
      schedule:
        quartz_cron_expresion: "0 30 6 * * ?"
        timezone_id: UTC

      parameters:
        - name: target
          default: ${bundle.target}

      tasks:
        - task_key: health_check
          # No cluster defined → the task runs on serverless compute.
          notebook_task:
            notebook_path: ../src/notebooks/health_check.py
