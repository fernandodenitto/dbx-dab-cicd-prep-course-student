# AI/BI dashboard (formerly Lakeview). The .lvdash.json holds the layout and the queries;
# queries use bare table names, and the bundle supplies catalog and schema per target.

resources:
  dashboards:
    revenue:
      display_name: Lakeshore revenue
      file_path: ../src/dashboards/revenue.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${resources.schemas.gold.name}
