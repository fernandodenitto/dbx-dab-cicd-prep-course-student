extends: default

rules:
  line-length:
    max: 120
  document-start: disable
  comments:
    min-spaces-from-content: 1
  # GitHub Actions uses the bare key `on:`, which YAML 1.1 would read as a boolean.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false

ignore: |
  .venv/
  .databricks/
