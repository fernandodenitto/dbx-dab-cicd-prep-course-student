[project]
# The distribution name of the wheel the bundle builds and deploys (lakeshore-*.whl).
name = "lakeshore"
version = "0.1.0"
description = "Lakeshore Outfitters data platform, deployed as a Declarative Automation Bundle"
# Serverless environment version 5 runs Python 3.12 — test locally on the same version.
requires-python = ">=3.12,<3.13"
# Runtime dependencies of the package. None: the standard library is enough.
dependencies = []

[project.scripts]
# The entry point a python_wheel_task calls (see resources/ingest.job.yml).
lakeshore-ingest = "lakeshore.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ also holds notebooks and SQL; only the package goes into the wheel.
packages = ["src/lakeshore"]

[dependency-groups]
# Tools only CI and developers need; never shipped to Databricks.
dev = [
    "ruff>=0.13",
    "yamllint>=1.37",
    "check-jsonschema>=0.38",
    "pytest>=8",
    "pytest-cov>=6",
    # Python support for bundles: the CLI loads mutators.py from this environment.
    # Keep it on the same version as the CLI pinned in databricks.yml.
    "databricks-bundles==1.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ directly: tests never depend on how (or whether) the
# package was installed in the virtual environment.
pythonpath = ["src", "."]
# Fail the run if less than 90% of the package is exercised by tests.
addopts = "--cov=lakeshore --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks get `spark` and `dbutils` injected by the runtime.
"src/notebooks/*.py" = ["F821"]
