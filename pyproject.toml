[project]
name = "lakeshore-platform"
version = "0.1.0"
description = "Lakeshore Outfitters data platform, deployed as a Declarative Automation Bundle"
# Serverless environment version 5 runs Python 3.12 — test locally on the same version.
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# Tools only CI and developers need; never shipped to Databricks.
dev = [
    "ruff>=0.13",
    "yamllint>=1.37",
    "check-jsonschema>=0.38",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks get `spark` and `dbutils` injected by the runtime.
"src/notebooks/*.py" = ["F821"]
