# Continuous integration: runs on every pull request to main and on every push to main.
# No secrets yet — everything here works without a Databricks login.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch: a new push cancels the run it made obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The GITHUB_TOKEN gets read access only. Jobs ask for more when they need it.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA (the tag is in the comment):
      # a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7  # v1.19.0

      - name: Install dev tools
        run: uv sync --locked

      - name: Python lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: YAML lint
        run: uv run yamllint --strict .

      - name: Bundle schema check (no credentials needed)
        run: |
          databricks bundle schema > "$RUNNER_TEMP/bundle-schema.json"
          uv run check-jsonschema --schemafile "$RUNNER_TEMP/bundle-schema.json" \
            databricks.yml resources/*.yml

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install
        run: uv sync --locked
      # Pure Python: no Databricks login, no cluster, seconds. Coverage below 90% fails.
      - name: pytest
        run: uv run pytest

  validate:
    name: validate
    needs: lint
    # Secrets are never given to workflows triggered from forks, so skip there instead of
    # failing. A job skipped by `if:` reports success to required checks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Use the staging environment's secrets without recording a "deployment":
    # validating is not deploying.
    environment:
      name: staging
      deployment: false
    env:
      # OAuth machine-to-machine: the CLI exchanges client ID + secret for a
      # short-lived token. No personal token anywhere.
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7  # v1.19.0

      - name: Who am I?
        run: databricks current-user me --output json | jq -r '"\(.displayName) (\(.userName))"'

      - name: Validate staging (strict)
        run: databricks bundle validate --strict --target staging

      # prod is validated with the STAGING identity: the prod credentials stay locked
      # behind the prod environment's approval. Identity-specific findings (who owns the
      # deploy folder) are expected here, so no --strict; config errors still fail.
      - name: Validate prod (config only)
        run: databricks bundle validate --target prod
