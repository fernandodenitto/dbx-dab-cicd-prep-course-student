# Promotion to production. Triggered by a release tag (v*), or by hand for a given tag —
# which is also how you roll back: deploy the previous tag.
#
#   plan    (environment prod-plan): what this release would change in prod, as a summary
#   deploy  (environment prod)     : waits for a required reviewer, then re-plans, checks
#                                    the actions still match the approved plan, deploys
name: cd-prod

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy (an older tag = rollback)
        required: true

# One production deployment at a time, and never cancelled half-way.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  plan:
    name: plan-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod-plan
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      # Tooling (setup action, scripts) from the workflow's own commit; the bundle from the
      # release tag, in ./release. Deploying an old tag (a rollback) must not depend on
      # the CI files that tag happened to contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check out the release
        run: git worktree add release "$RELEASE_REF"

      - name: Plan prod
        run: |
          (cd release && databricks bundle plan --target prod --output json) > plan.json
          uv run python scripts/plan_report.py summary plan.json "Plan for prod — ${RELEASE_REF}" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: approved-plan
          path: plan.json

  deploy:
    name: deploy-prod
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer: the job waits here until someone approves in the GitHub UI.
    # The prod secrets are not released to the job before that.
    environment: prod
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      # Tooling (setup action, scripts) from the workflow's own commit; the bundle from the
      # release tag, in ./release. Deploying an old tag (a rollback) must not depend on
      # the CI files that tag happened to contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check out the release
        run: git worktree add release "$RELEASE_REF"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: approved-plan

      # Production may have changed while the approval was pending. Re-plan and refuse
      # to continue if the actions differ from what the reviewer saw.
      - name: Check the plan still matches the approval
        run: |
          (cd release && databricks bundle plan --target prod --output json) > fresh.json
          uv run python scripts/plan_report.py compare plan.json fresh.json

      # Not `deploy --plan plan.json`: on CLI 1.19.0 that applies the plan without
      # uploading the wheel the plan refers to (see lesson 9.4).
      - name: Deploy
        working-directory: release
        run: databricks bundle deploy --target prod --fail-on-active-runs

      - name: Smoke test
        working-directory: release
        run: databricks bundle run --target prod health_check

      - name: Record what was released
        run: echo "Released **${RELEASE_REF}** to **prod**." >> "$GITHUB_STEP_SUMMARY"
