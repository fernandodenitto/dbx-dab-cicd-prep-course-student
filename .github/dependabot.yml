# Dependabot opens pull requests when a pinned action or a Python dependency has a new
# release — so SHA-pinned actions don't silently rot. Every update goes through CI.
version: 2
updates:
  - package-ecosystem: github-actions
    # Workflows live under / (.github/workflows); our composite action has its own folder.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
